<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>任务通知</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #17202e 0%, #0b0e14 55%);
    color: #e8edf6; min-height: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: linear-gradient(160deg, #ff7a45, #ff6335);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #fff;
    box-shadow: 0 4px 18px rgba(255, 105, 60, .35);
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: #93a0b5; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #56607a; transition: background .3s; }
  .pill.on .dot { background: #37d67a; box-shadow: 0 0 8px rgba(55, 214, 122, .8); }
  .pill.on { color: #7ee2a8; }

  #scanBtn {
    display: flex; align-items: center; gap: 5px; cursor: pointer;
    font-size: 12px; color: #e8edf6; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px;
  }
  #scanBtn:active { transform: translateY(1px); }

  /* 扫码遮罩 */
  #scanLayer {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: #05070b; flex-direction: column;
  }
  #scanLayer.on { display: flex; }
  #scanVideo { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  #scanTip {
    padding: 14px 18px; text-align: center; font-size: 14px; color: #c9d1e0;
    background: rgba(255,255,255,.05);
  }
  #scanClose {
    margin: 14px auto 26px; display: block; cursor: pointer;
    font-size: 14px; color: #e8edf6; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: 10px 26px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 60;
    max-width: 84%; font-size: 13px; line-height: 1.5; color: #fff;
    background: rgba(20, 26, 36, .95); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; padding: 10px 16px; display: none; text-align: center;
  }

  #askNotif {
    width: 100%; border: 1px dashed rgba(255, 122, 69, .55); color: #ffab8a;
    background: rgba(255, 122, 69, .08); border-radius: 14px; padding: 12px;
    font-size: 14px; margin-bottom: 14px; cursor: pointer;
  }

  .card {
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chip {
    font-size: 11px; color: #ffb694; background: rgba(255, 122, 69, .13);
    border: 1px solid rgba(255, 122, 69, .25); border-radius: 6px; padding: 2px 8px;
    max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .time { font-size: 12px; color: #6f7b92; }
  .ntitle { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .nbody { font-size: 14px; line-height: 1.55; color: #b8c2d4; word-break: break-all; }
  .more { font-size: 12px; color: #ffab8a; margin-top: 8px; }
  .reply {
    display: block; margin-top: 10px; text-align: center; text-decoration: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(160deg, #cf430d, #b53708);   /* 加深一档：白字对比度 ≥4.5:1 */
    border-radius: 10px; padding: 9px 12px;
  }
  .reply:active { transform: translateY(1px); }

  #empty { text-align: center; padding: 90px 0 0; display: none; }
  #empty .bell { font-size: 54px; opacity: .5; }
  #empty p { margin-top: 14px; color: #8b97ac; font-size: 15px; }
  #empty .sub { font-size: 13px; color: #5d687c; margin-top: 6px; }

  footer { text-align: center; font-size: 12px; color: #566078; margin-top: 28px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Z</div>
      <h1>任务通知</h1>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="scanBtn">⛶ 扫码</button>
      <div id="live" class="pill"><span class="dot"></span><span id="liveText">连接中…</span></div>
    </div>
  </header>

  <button id="askNotif" hidden>开启系统通知（锁屏也能弹）</button>

  <main id="list"></main>

  <div id="empty">
    <div class="bell">🔔</div>
    <p>还没有通知</p>
    <p class="sub">ZCode 完成任务后，会第一时间在这里响铃</p>
  </div>

  <footer>
    需与电脑连同一个 Wi-Fi · 服务地址 <span id="srv">…</span><br>
    电脑端启动：双击 zcode-notify 目录下的 启动通知服务.bat
  </footer>

  <div id="scanLayer">
    <div id="scanTip">对准电脑控制台的二维码可扫码配对；其它链接（如 zcode.z.ai/remote）会设为远程页面链接</div>
    <video id="scanVideo" muted playsinline autoplay></video>
    <button id="scanClose">关闭</button>
  </div>
  <div id="toast"></div>
</div>

<script src="/qr.min.js" onerror="window.__noqr=1"></script>
<script src="/jsqr.min.js" onerror="window.__nojsqr=1"></script>

<script>
const TOKEN = '__TOKEN__';
const $ = s => document.querySelector(s);
let items = [];
const seen = new Set();

/* ---------- 渲染 ---------- */
function timefmt(ts) {
  const d = Date.now() / 1000 - ts;
  if (d < 10) return '刚刚';
  if (d < 3600) return Math.max(1, Math.floor(d / 60)) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false });
}

function render() {
  const list = $('#list');
  list.innerHTML = '';
  for (const it of items) {
    const card = document.createElement('div');
    card.className = 'card';
    const chip = it.project ? '<span class="chip">' + esc(it.project) + '</span>' : '<span></span>';
    const hasFull = it.full && it.full.length > (it.body || '').length + 10;
    const reply = it.link
      ? '<div class="reply" data-url="' + esc(it.link) + '">打开远程页面回复 ▸</div>'
      : '';
    card.innerHTML =
      '<div class="row">' + chip + '<span class="time">' + timefmt(it.ts) + '</span></div>' +
      '<div class="ntitle">' + esc(it.title) + '</div>' +
      '<div class="nbody">' + esc(it.body || '') + '</div>' +
      (hasFull ? '<div class="more">点开看全文 ▾</div>' : '') + reply;
    if (hasFull) {
      let open = false;
      card.addEventListener('click', e => {
        if (e.target.closest('.reply')) return;   // 不让展开全文的点击干扰按钮跳转
        open = !open;
        card.querySelector('.nbody').textContent = open ? it.full : it.body;
        card.querySelector('.more').textContent = open ? '收起 ▴' : '点开看全文 ▾';
      });
    }
    const rp = card.querySelector('.reply');
    if (rp) rp.addEventListener('click', ev => {
      ev.stopPropagation();
      const u = rp.getAttribute('data-url');
      if (window.AndroidNotify && AndroidNotify.openRemote) AndroidNotify.openRemote(u);
      else window.open(u, '_blank', 'noopener');
    });
    list.appendChild(card);
  }
  $('#empty').style.display = items.length ? 'none' : 'block';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- 数据 ---------- */
function push(d, fresh) {
  if (!d || !d.id || seen.has(d.id)) return;
  seen.add(d.id);
  items.unshift(d);
  items = items.slice(0, 100);
  try { localStorage.setItem('zn_cache', JSON.stringify(items)); } catch (e) {}
  render();
  if (fresh) {
    ding();
    try { navigator.vibrate && navigator.vibrate([60, 50, 60]); } catch (e) {}
    try {
      if (window.Notification && Notification.permission === 'granted') {
        new Notification(d.title, { body: d.body || '', icon: '/icons/icon-192.png', tag: d.id });
      }
    } catch (e) {}
  }
}

async function load() {
  try {
    const r = await fetch('/history');
    const d = await r.json();
    items = d.items || [];
  } catch (e) {
    try { items = JSON.parse(localStorage.getItem('zn_cache') || '[]'); } catch (e2) { items = []; }
  }
  for (const it of items) seen.add(it.id);
  render();
}

/* ---------- 实时连接 ---------- */
function setLive(on) {
  $('#live').classList.toggle('on', on);
  $('#liveText').textContent = on ? '实时连接' : '重连中…';
}

function connect() {
  const url = '/events' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
  const es = new EventSource(url);
  es.addEventListener('notify', ev => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    push(d, true);
  });
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);   // EventSource 会自动重连
}

/* ---------- 响铃 ---------- */
let AC;
function ding() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    [[880, 0], [1174.7, 0.09]].forEach(([f, dt]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(0.22, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.35);
      o.connect(g); g.connect(AC.destination);
      o.start(t + dt); o.stop(t + dt + 0.4);
    });
  } catch (e) {}
}

/* ---------- 系统通知权限 ---------- */
const askBtn = $('#askNotif');
if (window.Notification) {
  if (Notification.permission === 'default') askBtn.hidden = false;
  askBtn.onclick = () => Notification.requestPermission().then(() => { askBtn.hidden = true; });
}

$('#srv').textContent = location.host;
load();
connect();
setInterval(render, 30000);   // 相对时间刷新

/* ---------- 扫码更新远程链接 ---------- */
let scanStream = null, scanRaf = 0;

function scanLog(step, extra) {
  try {   // 每一步上报服务端（scan_debug.log），远程定位扫码卡在哪
    fetch('/scanlog', { method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ step: step, info: extra || '' }) });
  } catch (e) {}
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._h);
  toast._h = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function stopScan() {
  cancelAnimationFrame(scanRaf);
  if (scanStream) { scanStream.getTracks().forEach(x => x.stop()); scanStream = null; }
  $('#scanVideo').srcObject = null;
  $('#scanLayer').classList.remove('on');
}

function scanFailed(msg) {
  stopScan();
  toast(msg || '扫码未成功');
}

async function onDecoded(text) {
  stopScan();
  const url = String(text || '').trim();
  if (!/^https?:\/\//i.test(url)) return scanFailed('二维码内容不是链接');
  // 两种语义：指向通知服务的码 → 扫码配对；其它链接（如 zcode.z.ai/remote/...）→ 设为远程页面链接
  if (/\/phone(\/|\?|$)/i.test(url)) {
    if (window.AndroidNotify && AndroidNotify.connectTo) {
      AndroidNotify.connectTo(url);
      scanLog('apply-pair', url.slice(0, 80));
      toast('已配对电脑：' + url.replace(/^https?:\/\//, ''));
    } else {
      toast('网页版本身就是连接状态，无需配对');
    }
    return;
  }
  try {
    const r = await fetch('/config?token=' + encodeURIComponent(TOKEN), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ remote_url: url })
    });
    if (!r.ok) throw 0;
    scanLog('apply-remote-ok', url.slice(0, 80));
    toast('远程链接已更新 ✓ 之后的通知都带新链接');
  } catch (e) {
    scanLog('apply-remote-fail', url.slice(0, 80));
    toast('链接已识别，但保存失败（服务器没连上？）');
  }
}

async function startScan() {
  scanLog('start', 'secure=' + window.isSecureContext +
          ' jsqr=' + (typeof window.jsQR) +
          ' mediaDevices=' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) +
          ' bridge=' + !!(window.AndroidNotify));
  if (!window.jsQR || window.__nojsqr) { scanLog('err', 'jsqr-missing'); return toast('解码库没加载成功，请在管理面板手动粘贴链接'); }
  // getUserMedia 仅安全上下文（https/localhost）可用；WebView 里是 http://局域网IP，走拍照解码
  const liveOK = window.isSecureContext &&
                 navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if (!liveOK) { scanLog('branch', 'photo-fallback'); return photoScan(); }
  scanLog('branch', 'live-camera');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    scanLog('cam-ok', '');
  } catch (e) {
    const n = (e && e.name) || '';
    scanLog('cam-err', n + ' ' + (e && e.message || ''));
    if (n === 'NotAllowedError' || n === 'SecurityError')
      return toast('相机权限被拒绝：请在系统设置里允许本应用使用相机，然后重新点扫码');
    if (n === 'NotFoundError' || n === 'OverconstrainedError')
      return toast('没找到可用的摄像头');
    return toast('相机没开成：' + (n || e));
  }
  const video = $('#scanVideo');
  video.srcObject = scanStream;
  $('#scanLayer').classList.add('on');
  try { await video.play(); } catch (e) {}
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let busy = false;
  const tick = () => {
    if (!scanStream) return;
    if (video.readyState >= video.HAVE_ENOUGH_DATA && video.videoWidth && !busy) {
      busy = true;
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      busy = false;
      if (code && code.data) { scanLog('decoded', String(code.data).slice(0, 80)); return onDecoded(code.data); }
    }
    scanRaf = requestAnimationFrame(tick);
  };
  scanRaf = requestAnimationFrame(tick);
}

/* 拍照解码：调系统相机拍一张（或从相册选），jsQR 解静态图。 */
function photoScan() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    scanLog('photo-pick', (file.type || '') + ' ' + file.size);
    toast('识别中…');
    const img = new Image();
    const objURL = URL.createObjectURL(file);
    img.onload = () => {
      // 屏幕照片常有摩尔纹/反光/角度：多尺度 + 反色各试一遍，识别率比单次高很多
      let code = null;
      for (const scale of [1, 0.5, 1.6]) {
        const c = document.createElement('canvas');
        c.width = Math.max(120, Math.round(img.width * scale));
        c.height = Math.max(120, Math.round(img.height * scale));
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptInverted' });
        if (code && code.data) break;
      }
      URL.revokeObjectURL(objURL);
      if (code && code.data) { scanLog('photo-decoded', ''); onDecoded(code.data); }
      else { scanLog('photo-fail', 'scales-exhausted'); toast('没识别出二维码：离近一点、让码占满画面、避免反光再拍一张'); }
    };
    img.onerror = () => { URL.revokeObjectURL(objURL); scanLog('photo-read-err', ''); toast('照片读不出来，请重试'); };
    img.src = objURL;
  };
  inp.click();
}

$('#scanBtn').onclick = startScan;
$('#scanClose').onclick = stopScan;
</script>
</body>
</html>
